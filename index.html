<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Online Dice - Virtual Dice Simulator</title>

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    linear-gradient(rgba(0,140,255,.75),rgba(0,140,255,.75)),
    url("https://www.transparenttextures.com/patterns/cubes.png");
    background-size:300px;
    font-family:Arial, sans-serif;
    min-height:100vh;
    color:white;
}

.container{
    width:95%;
    max-width:1100px;
    margin:auto;
    padding:30px 0 80px;
}

.logo{
    display:block;
    margin:auto;
    width:430px;
    max-width:95%;
}

.card{
    margin:35px auto;
    background:rgba(255,255,255,.12);
    border:4px solid rgba(255,255,255,.25);
    border-radius:24px;
    padding:28px;
    backdrop-filter:blur(4px);
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.main-card{
    max-width:720px;
}

.history-card{
    max-width:720px;
}

.title{
    font-family:'Luckiest Guy', cursive;
    text-align:center;
    font-size:44px;
    letter-spacing:2px;
    text-shadow:4px 4px 0 rgba(0,0,0,.15);
    margin-bottom:20px;
}

.controls{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:28px;
}

select{
    padding:14px 18px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    font-size:18px;
    background:white;
    color:#1881ff;
    font-family:'Luckiest Guy', cursive;
}

.dice-area{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    margin-bottom:28px;
}

.die{
    width:120px;
    height:120px;
    border-radius:22px;
    border:8px solid white;
    position:relative;
    box-shadow:
    inset 0 -8px 0 rgba(0,0,0,.15),
    0 8px 15px rgba(0,0,0,.25);
    transition:.25s;
}

.dot{
    width:20px;
    height:20px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.roll-animation{
    animation:roll .7s ease;
}

@keyframes roll{
    0%{
        transform:rotate(0deg) scale(1);
    }
    25%{
        transform:rotate(90deg) scale(.8);
    }
    50%{
        transform:rotate(180deg) scale(1.1);
    }
    75%{
        transform:rotate(270deg) scale(.9);
    }
    100%{
        transform:rotate(360deg) scale(1);
    }
}

.roll-btn{
    width:100%;
    border:none;
    border-radius:14px;
    background:#ffe500;
    color:white;
    font-family:'Luckiest Guy', cursive;
    font-size:42px;
    padding:18px;
    cursor:pointer;
    text-shadow:3px 3px 0 rgba(0,0,0,.2);
    border:5px solid rgba(255,255,255,.6);
    box-shadow:0 6px 0 #d0ba00;
    transition:.15s;
}

.roll-btn:hover{
    transform:translateY(-2px);
}

.roll-btn:active{
    transform:translateY(5px);
    box-shadow:none;
}

.info{
    margin-top:18px;
    text-align:center;
    font-size:20px;
    line-height:1.6;
}

.red{color:red;}
.orange{color:orange;}
.yellow{color:yellow;}
.green{color:green;}
.blue{color:blue;}
.purple{color:purple;}

.history-title{
    font-family:'Luckiest Guy', cursive;
    text-align:center;
    font-size:54px;
    margin-bottom:25px;
    text-shadow:4px 4px 0 rgba(0,0,0,.15);
}

.history-item{
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 0;
    border-bottom:2px dashed rgba(255,255,255,.4);
}

.roll-number{
    font-size:40px;
    font-family:'Luckiest Guy', cursive;
    width:60px;
}

.history-dice{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.small-die{
    width:42px;
    height:42px;
    border-radius:10px;
    border:4px solid white;
    position:relative;
}

.small-die .dot{
    width:9px;
    height:9px;
}

.secret-menu{
    display:none;
    margin-top:25px;
    background:rgba(0,0,0,.25);
    padding:20px;
    border-radius:18px;
}

.secret-menu h2{
    margin-bottom:15px;
    font-family:'Luckiest Guy', cursive;
    letter-spacing:1px;
}

.secret-menu button{
    padding:12px 16px;
    border:none;
    border-radius:10px;
    margin:5px;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:700px){

    .die{
        width:85px;
        height:85px;
        border-width:6px;
    }

    .title{
        font-size:34px;
    }

    .history-title{
        font-size:40px;
    }

    .roll-btn{
        font-size:30px;
    }

    .controls{
        flex-direction:column;
    }

    select{
        width:100%;
    }

    .dice-area{
        gap:14px;
    }
}
</style>
</head>
<body>

<div class="container">

<img class="logo" src="https://www.online-dice.com/img/logo-online-dice.png">

<div class="card main-card">

<h1 class="title">ROLL COLOR DICE</h1>

<div class="controls">

<select id="diceCount">
<option value="1">1 DICE</option>
<option value="2">2 DICE</option>
<option value="3">3 DICE</option>
<option value="4" selected>4 DICE</option>
<option value="5">5 DICE</option>
<option value="6">6 DICE</option>
</select>

<select id="mode">
<option>COLOR DICE</option>
</select>

<select id="selectMode">
<option>SELECT 1</option>
</select>

</div>

<div class="dice-area" id="diceArea"></div>

<button class="roll-btn" onclick="rollDice()">
ROLL AGAIN !
</button>

<div class="info">
Possible colors are:
<span class="red">Red</span>,
<span class="orange">Orange</span>,
<span class="yellow">Yellow</span>,
<span class="green">Green</span>,
<span class="blue">Blue</span>
and
<span class="purple">Purple</span>.
</div>

<div class="secret-menu" id="secretMenu">

<h2>Secret Menu</h2>

<p style="margin-bottom:15px;">
Choose what color shows up more often.
</p>

<button onclick="setRig('red')">Red</button>
<button onclick="setRig('orange')">Orange</button>
<button onclick="setRig('yellow')">Yellow</button>
<button onclick="setRig('green')">Green</button>
<button onclick="setRig('blue')">Blue</button>
<button onclick="setRig('purple')">Purple</button>
<button onclick="setRig(null)">Normal</button>

</div>

</div>

<div class="card history-card">

<h1 class="history-title">YOUR LAST 20 ROLLS:</h1>

<div id="history"></div>

</div>

</div>

<script>

const colors = [
"red",
"orange",
"yellow",
"green",
"blue",
"purple"
];

let historyRolls = [];
let riggedColor = null;

const diceArea = document.getElementById("diceArea");
const historyDiv = document.getElementById("history");

function createDie(color){

    const die = document.createElement("div");
    die.className = "die";
    die.style.background = color;

    const dot = document.createElement("div");
    dot.className = "dot";

    die.appendChild(dot);

    return die;
}

function createSmallDie(color){

    return `
    <div class="small-die" style="background:${color}">
        <div class="dot"></div>
    </div>
    `;
}

function getRandomColor(){

    if(riggedColor && Math.random() < 0.55){
        return riggedColor;
    }

    return colors[Math.floor(Math.random() * colors.length)];
}

function rollDice(){

    diceArea.innerHTML = "";

    const count = parseInt(
        document.getElementById("diceCount").value
    );

    const roll = [];

    for(let i=0;i<count;i++){

        const color = getRandomColor();

        roll.push(color);

        const die = createDie(color);

        die.classList.add("roll-animation");

        diceArea.appendChild(die);
    }

    historyRolls.unshift(roll);

    if(historyRolls.length > 20){
        historyRolls.pop();
    }

    updateHistory();
}

function updateHistory(){

    historyDiv.innerHTML = "";

    historyRolls.forEach((roll,index)=>{

        const row = document.createElement("div");
        row.className = "history-item";

        row.innerHTML = `
        <div class="roll-number">${index+1}.</div>

        <div class="history-dice">
            ${roll.map(c=>createSmallDie(c)).join("")}
        </div>
        `;

        historyDiv.appendChild(row);
    });
}

function setRig(color){

    riggedColor = color;

    if(color){
        alert("Rigged toward " + color);
    }else{
        alert("Normal mode enabled");
    }
}

let tapCount = 0;

document.querySelector(".logo").addEventListener("click",()=>{

    tapCount++;

    if(tapCount >= 5){

        document.getElementById("secretMenu").style.display = "block";

        tapCount = 0;
    }

    setTimeout(()=>{
        tapCount = 0;
    },2000);

});

rollDice();

</script>

</body>
</html>
