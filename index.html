<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Dice</title>

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:
    linear-gradient(rgba(70,170,255,.78),rgba(40,145,255,.88)),
    url('https://www.transparenttextures.com/patterns/cubes.png');
    min-height:100vh;
    color:white;
    overflow-x:hidden;
}

/* TOP */

.top{
    text-align:center;
    padding-top:35px;
    margin-bottom:25px;
}

.logo{
    font-family:'Luckiest Guy', cursive;
    font-size:64px;
    color:#ffcf3a;
    text-shadow:
    0 2px 0 #c78200,
    0 4px 0 #c78200,
    0 6px 10px rgba(0,0,0,.2);
    letter-spacing:3px;
}

.subtitle{
    font-family:'Luckiest Guy', cursive;
    font-size:26px;
    margin-top:5px;
    color:white;
    text-shadow:0 3px 0 rgba(0,0,0,.2);
}

/* MAIN BOX */

.box{
    width:95%;
    max-width:420px;
    margin:auto;
    background:rgba(255,255,255,.08);
    border:3px solid rgba(255,255,255,.25);
    border-radius:20px;
    padding:22px;
    backdrop-filter:blur(4px);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.section-title{
    font-family:'Luckiest Guy', cursive;
    text-align:center;
    font-size:28px;
    margin-bottom:18px;
    text-shadow:0 3px 0 rgba(0,0,0,.2);
}

/* SELECTS */

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:24px;
}

select{
    padding:10px;
    border:none;
    border-radius:6px;
    font-weight:bold;
    color:#1572ff;
    background:white;
    font-size:15px;
}

/* DICE */

.dice-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
    flex-wrap:nowrap;
    margin-bottom:28px;
}

.dice{
    width:78px;
    height:78px;
    border-radius:14px;
    border:6px solid white;
    position:relative;
    box-shadow:0 4px 0 rgba(0,0,0,.18);
    transition:.15s;
    flex-shrink:0;
}

.dice::after{
    content:'';
    position:absolute;
    width:16px;
    height:16px;
    background:white;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.blue{background:#1d12ff;}
.green{background:#0d9800;}
.red{background:#ff1f1f;}
.orange{background:#ffae00;}
.yellow{background:#ffd400;}
.purple{background:#a000b3;}

/* ROLL ANIMATION */

.rolling{
    animation:roll .45s ease;
}

@keyframes roll{
    0%{
        transform:scale(.8) rotate(0deg);
    }
    40%{
        transform:scale(1.1) rotate(10deg);
    }
    100%{
        transform:scale(1) rotate(0deg);
    }
}

/* BUTTON */

.roll-btn{
    width:100%;
    border:none;
    border-radius:8px;
    background:#ffe600;
    color:white;
    font-family:'Luckiest Guy', cursive;
    font-size:28px;
    padding:14px;
    cursor:pointer;
    text-shadow:0 3px 0 rgba(0,0,0,.25);
    box-shadow:0 5px 0 #d6b800;
}

.roll-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #d6b800;
}

/* HISTORY */

.history{
    width:95%;
    max-width:420px;
    margin:25px auto;
    background:rgba(255,255,255,.08);
    border:3px solid rgba(255,255,255,.25);
    border-radius:20px;
    padding:22px;
}

.history-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 0;
    border-bottom:1px dashed rgba(255,255,255,.45);
}

.small-dice{
    width:28px;
    height:28px;
    border-radius:7px;
    border:3px solid white;
    position:relative;
}

.small-dice::after{
    content:'';
    position:absolute;
    width:7px;
    height:7px;
    background:white;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* MOBILE */

@media(max-width:600px){

    .logo{
        font-size:48px;
    }

    .subtitle{
        font-size:20px;
    }

    .dice{
        width:64px;
        height:64px;
    }

    .controls{
        gap:6px;
    }

    select{
        width:100%;
        font-size:13px;
    }

    .roll-btn{
        font-size:22px;
    }

}

</style>
</head>
<body>

<div class="top">
    <div class="logo">ONLINE DICE</div>
    <div class="subtitle">VIRTUAL DICE SIMULATOR</div>
</div>

<div class="box">

    <div class="section-title">
        ROLL COLOR DICE
    </div>

    <div class="controls">
        <select>
            <option>4 DICE</option>
        </select>

        <select>
            <option>COLOR</option>
        </select>

        <select>
            <option>SELECT 1</option>
        </select>
    </div>

    <div class="dice-container" id="diceContainer">

        <div class="dice blue"></div>
        <div class="dice green"></div>
        <div class="dice red"></div>
        <div class="dice orange"></div>

    </div>

    <button class="roll-btn" onclick="rollDice()">
        ROLL AGAIN !
    </button>

</div>

<div class="history">

    <div class="section-title">
        YOUR LAST 20 ROLLS:
    </div>

    <div id="historyList"></div>

</div>

<!-- SECRET MENU -->

<div id="secretMenu" style="
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
border-radius:14px;
z-index:99999;
">

<h2 style="margin-bottom:15px;">Hidden Menu</h2>

<button onclick="setForced('red')">Red</button>
<button onclick="setForced('blue')">Blue</button>
<button onclick="setForced('green')">Green</button>
<button onclick="setForced('yellow')">Yellow</button>
<button onclick="setForced('orange')">Orange</button>
<button onclick="setForced('purple')">Purple</button>

<br><br>

<button onclick="
document.getElementById('secretMenu').style.display='none'
">
Close
</button>

</div>

<script>

const colors = [
'red',
'blue',
'green',
'yellow',
'orange',
'purple'
];

let forcedColor = null;

function setForced(color){
    forcedColor = color;
}

document.addEventListener('keydown', e => {

    if(e.ctrlKey && e.shiftKey && e.key === 'M'){

        const menu = document.getElementById('secretMenu');

        menu.style.display =
        menu.style.display === 'block'
        ? 'none'
        : 'block';
    }
});

const historyList = document.getElementById('historyList');

function rollDice(){

    const dice = document.querySelectorAll('.dice');

    let row = document.createElement('div');
    row.className = 'history-row';

    dice.forEach(die => {

        die.classList.add('rolling');

        setTimeout(() => {

            die.className = 'dice';

            const color =
            forcedColor ||
            colors[Math.floor(Math.random()*colors.length)];

            die.classList.add(color);

            let small = document.createElement('div');
            small.className = 'small-dice ' + color;

            row.appendChild(small);

        }, 250);

        setTimeout(() => {
            die.classList.remove('rolling');
        }, 450);

    });

    setTimeout(() => {

        historyList.prepend(row);

        while(historyList.children.length > 20){
            historyList.removeChild(historyList.lastChild);
        }

    }, 300);

}

</script>

</body>
</html>
