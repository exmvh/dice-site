<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Online Dice</title>

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#49a8ff;
    overflow-x:hidden;
    min-height:100vh;
}

/* BACKGROUND PATTERN */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(rgba(255,255,255,.08) 2px, transparent 2px);
    background-size:42px 42px;
    opacity:.45;
    pointer-events:none;
}

/* MAIN */

.main{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px 15px 100px;
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:25px;
    user-select:none;
}

.logo-title{
    font-family:'Luckiest Guy', cursive;
    font-size:78px;
    color:#ffc928;
    letter-spacing:3px;
    text-shadow:
        0 3px 0 #c78300,
        0 6px 0 #9c5f00,
        0 0 12px rgba(255,255,255,.4);
}

.logo-sub{
    margin-top:-10px;
    font-family:'Luckiest Guy', cursive;
    color:white;
    font-size:34px;
    text-shadow:0 4px rgba(0,0,0,.15);
}

/* TOP BOX */

.card{
    width:100%;
    max-width:780px;
    background:rgba(255,255,255,.10);
    border:4px solid rgba(255,255,255,.35);
    border-radius:24px;
    padding:28px;
    backdrop-filter:blur(3px);
    box-shadow:0 8px 30px rgba(0,0,0,.15);
}

/* TITLE */

.roll-title{
    font-family:'Luckiest Guy', cursive;
    color:white;
    font-size:46px;
    text-align:center;
    margin-bottom:20px;
    text-shadow:0 4px rgba(0,0,0,.15);
}

/* DROPDOWNS */

.controls{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:28px;
}

.controls select{
    height:54px;
    border:none;
    outline:none;
    border-radius:8px;
    background:white;
    color:#1f7cff;
    padding:0 16px;
    font-size:24px;
    font-family:'Luckiest Guy', cursive;
    box-shadow:0 4px rgba(0,0,0,.12);
}

/* DICE ROW */

.dice-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    flex-wrap:nowrap;
    overflow-x:auto;
    margin-bottom:30px;
    padding-bottom:5px;
}

/* DICE */

.dice{
    width:120px;
    height:120px;
    border-radius:18px;
    border:8px solid white;
    position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
    flex-shrink:0;
}

.dot{
    width:22px;
    height:22px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* COLORS */

.red{ background:#ff1c1c; }
.orange{ background:#ff9f00; }
.yellow{ background:#ffd400; }
.green{ background:#0c9f00; }
.blue{ background:#1b14ff; }
.purple{ background:#9800a8; }

/* BUTTON */

.roll-btn{
    width:100%;
    height:90px;
    background:#ffe100;
    border-radius:10px;
    border:4px solid rgba(255,255,255,.7);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;

    font-family:'Luckiest Guy', cursive;
    color:white;
    font-size:52px;

    text-shadow:0 4px rgba(0,0,0,.18);
    box-shadow:0 6px rgba(0,0,0,.12);

    margin-bottom:18px;
}

.roll-btn:active{
    transform:translateY(2px);
}

/* INFO */

.info{
    width:100%;
    background:rgba(255,255,255,.18);
    border-radius:10px;
    padding:14px;
    text-align:center;
    color:white;
    font-size:26px;
    line-height:1.5;
}

.info span{
    font-weight:bold;
}

/* HISTORY */

.history{
    width:100%;
    max-width:780px;
    margin-top:28px;

    background:rgba(255,255,255,.10);
    border:4px solid rgba(255,255,255,.35);
    border-radius:24px;
    padding:28px;
}

.history-title{
    text-align:center;
    color:white;
    font-family:'Luckiest Guy', cursive;
    font-size:52px;
    margin-bottom:25px;
    text-shadow:0 4px rgba(0,0,0,.15);
}

.roll-row{
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:2px dashed rgba(255,255,255,.6);
    padding:16px 0;
}

.roll-number{
    color:white;
    font-size:34px;
    font-weight:bold;
    width:45px;
}

.small-dice{
    width:56px;
    height:56px;
    border-radius:10px;
    border:4px solid white;
    position:relative;
}

.small-dice .dot{
    width:12px;
    height:12px;
}

.note{
    color:white;
    font-size:24px;
    margin-top:24px;
    line-height:1.5;
}

/* MOBILE */

@media(max-width:700px){

.logo-title{
    font-size:52px;
}

.logo-sub{
    font-size:22px;
}

.card,
.history{
    padding:18px;
    border-radius:18px;
}

.roll-title{
    font-size:32px;
}

.controls{
    gap:8px;
}

.controls select{
    font-size:18px;
    height:46px;
}

.dice-wrap{
    gap:12px;
}

.dice{
    width:76px;
    height:76px;
    border-width:5px;
}

.dot{
    width:16px;
    height:16px;
}

.roll-btn{
    height:70px;
    font-size:34px;
}

.info{
    font-size:18px;
}

.history-title{
    font-size:38px;
}

.roll-number{
    font-size:26px;
}

.small-dice{
    width:42px;
    height:42px;
}

.note{
    font-size:18px;
}

}

</style>
</head>
<body>

<div class="main">

    <div class="logo">
        <div class="logo-title">ONLINE DICE</div>
        <div class="logo-sub">VIRTUAL DICE SIMULATOR</div>
    </div>

    <div class="card">

        <div class="roll-title">
            ROLL COLOR DICE
        </div>

        <div class="controls">

            <select>
                <option>4 DICE</option>
            </select>

            <select>
                <option>COLOR DICE</option>
            </select>

            <select>
                <option>SELECT 1</option>
            </select>

        </div>

        <div class="dice-wrap" id="diceWrap"></div>

        <div class="roll-btn" onclick="rollDice()">
            ROLL AGAIN !
        </div>

        <div class="info">
            Possible colors are:
            <span style="color:red">Red</span>,
            <span style="color:orange">Orange</span>,
            <span style="color:gold">Yellow</span>,
            <span style="color:green">Green</span>,
            <span style="color:blue">Blue</span>
            and
            <span style="color:purple">Purple</span>.
        </div>

    </div>

    <div class="history">

        <div class="history-title">
            YOUR LAST 20 ROLLS:
        </div>

        <div id="historyList"></div>

        <div class="note">
            Please note: only dice rolls with up to 6 dice are saved.
        </div>

    </div>

</div>

<script>

const allColors = [
    "red",
    "orange",
    "yellow",
    "green",
    "blue",
    "purple"
];

let disabledColors = [];
let history = [];

/* AVAILABLE COLORS */

function availableColors(){
    return allColors.filter(c => !disabledColors.includes(c));
}

/* CREATE DICE */

function createDice(color, small=false){

    const dice = document.createElement("div");

    dice.className = `${small ? 'small-dice' : 'dice'} ${color}`;

    const dot = document.createElement("div");
    dot.className = "dot";

    dice.appendChild(dot);

    return dice;
}

/* ROLL */

function rollDice(){

    const wrap = document.getElementById("diceWrap");

    wrap.innerHTML = "";

    const colors = availableColors();

    let currentRoll = [];

    for(let i=0;i<4;i++){

        const color =
            colors[Math.floor(Math.random()*colors.length)];

        currentRoll.push(color);

        wrap.appendChild(createDice(color));

    }

    history.unshift(currentRoll);

    if(history.length > 20){
        history.pop();
    }

    updateHistory();

}

/* HISTORY */

function updateHistory(){

    const historyList =
        document.getElementById("historyList");

    historyList.innerHTML = "";

    history.forEach((roll,index)=>{

        const row = document.createElement("div");
        row.className = "roll-row";

        const number = document.createElement("div");
        number.className = "roll-number";
        number.textContent = (index + 1) + ".";

        row.appendChild(number);

        roll.forEach(color=>{

            row.appendChild(
                createDice(color,true)
            );

        });

        historyList.appendChild(row);

    });

}

/* SECRET MENU */
/* HOLD LOGO FOR 3 SECONDS */

let holdTimer;

document.querySelector(".logo").addEventListener("touchstart", ()=>{

    holdTimer = setTimeout(openSecretMenu,3000);

});

document.querySelector(".logo").addEventListener("touchend", ()=>{

    clearTimeout(holdTimer);

});

document.querySelector(".logo").addEventListener("mousedown", ()=>{

    holdTimer = setTimeout(openSecretMenu,3000);

});

document.querySelector(".logo").addEventListener("mouseup", ()=>{

    clearTimeout(holdTimer);

});

/* SECRET SETTINGS */

function openSecretMenu(){

    let current = disabledColors.join(", ");

    let answer = prompt(
`Hidden Color Settings

Type colors to DISABLE separated by commas.

Example:
red, blue

Current disabled:
${current || "none"}`
    );

    if(answer === null) return;

    disabledColors = answer
        .split(",")
        .map(x=>x.trim().toLowerCase())
        .filter(x=>allColors.includes(x));

}

/* FIRST LOAD */

rollDice();

</script>

</body>
</html>
