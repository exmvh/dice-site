<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Online Dice</title>

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#39a2ff;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

/* BACKGROUND */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(rgba(255,255,255,.08) 2px, transparent 2px);
    background-size:40px 40px;
    opacity:.5;
    pointer-events:none;
}

/* HEADER */
.header{
    text-align:center;
    padding-top:20px;
}

.logo{
    font-family:'Luckiest Guy', cursive;
    font-size:72px;
    color:#ffc928;
    text-shadow:
        0 3px 0 #c97f00,
        0 6px 0 #9e6200,
        0 0 15px rgba(255,255,255,.5);
    letter-spacing:3px;
}

.sub{
    font-family:'Luckiest Guy', cursive;
    color:white;
    font-size:34px;
    margin-top:-8px;
    text-shadow:0 4px rgba(0,0,0,.15);
}

/* DICE */
.dice-wrap{
    display:flex;
    justify-content:center;
    gap:24px;
    flex-wrap:wrap;
    margin-top:50px;
    padding:0 20px;
}

.dice{
    width:130px;
    height:130px;
    border-radius:18px;
    border:8px solid white;
    position:relative;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.dot{
    width:22px;
    height:22px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.red{ background:#ff1818; }
.orange{ background:#ff9f00; }
.yellow{ background:#ffd400; }
.green{ background:#0aa000; }
.blue{ background:#1d14ff; }
.purple{ background:#9800a8; }

/* BUTTON */
.roll-btn{
    width:90%;
    max-width:720px;
    height:95px;
    margin:45px auto 25px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffd800;
    border-radius:12px;
    border:4px solid rgba(255,255,255,.8);
    font-family:'Luckiest Guy', cursive;
    font-size:54px;
    color:white;
    cursor:pointer;
    text-shadow:0 4px rgba(0,0,0,.18);
    box-shadow:0 6px rgba(0,0,0,.12);
}

.roll-btn:active{
    transform:translateY(2px);
}

/* TEXT */
.info{
    margin:30px auto;
    width:92%;
    max-width:900px;
    background:rgba(255,255,255,.15);
    border-radius:12px;
    padding:20px;
    color:white;
    font-size:28px;
    text-align:center;
    line-height:1.6;
}

.info span{
    font-weight:bold;
}

/* HISTORY */
.history{
    width:92%;
    max-width:900px;
    margin:40px auto 100px;
}

.history-title{
    font-family:'Luckiest Guy', cursive;
    color:white;
    font-size:58px;
    text-align:center;
    margin-bottom:30px;
    text-shadow:0 5px rgba(0,0,0,.12);
}

.roll-row{
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:2px dashed rgba(255,255,255,.6);
    padding:18px 0;
}

.roll-number{
    color:white;
    font-size:40px;
    width:50px;
    font-weight:bold;
}

.small-dice{
    width:70px;
    height:70px;
    border-radius:12px;
    border:5px solid white;
    position:relative;
}

.small-dice .dot{
    width:14px;
    height:14px;
}

/* MOBILE */
@media(max-width:700px){

.logo{
    font-size:54px;
}

.sub{
    font-size:24px;
}

.dice{
    width:90px;
    height:90px;
    border-width:6px;
}

.roll-btn{
    font-size:40px;
    height:80px;
}

.history-title{
    font-size:44px;
}

.info{
    font-size:22px;
}

}
</style>
</head>
<body>

<div class="header">
    <div class="logo">ONLINE DICE</div>
    <div class="sub">VIRTUAL DICE SIMULATOR</div>
</div>

<div class="dice-wrap" id="diceWrap"></div>

<div class="roll-btn" onclick="rollDice()">
    ROLL AGAIN !
</div>

<div class="info">
    Possible colors are:
    <span style="color:red">Red</span>,
    <span style="color:orange">Orange</span>,
    <span style="color:gold">Yellow</span>,
    <span style="color:green">Green</span>,
    <span style="color:blue">Blue</span>
    and
    <span style="color:purple">Purple</span>.
</div>

<div class="history">
    <div class="history-title">YOUR LAST 20 ROLLS:</div>

    <div id="historyList"></div>
</div>

<script>
const allColors = [
    "red",
    "orange",
    "yellow",
    "green",
    "blue",
    "purple"
];

let disabledColors = [];
let history = [];

function availableColors(){
    return allColors.filter(c => !disabledColors.includes(c));
}

function createDice(color, small=false){
    const dice = document.createElement("div");
    dice.className = `${small ? 'small-dice' : 'dice'} ${color}`;

    const dot = document.createElement("div");
    dot.className = "dot";

    dice.appendChild(dot);

    return dice;
}

function rollDice(){

    const wrap = document.getElementById("diceWrap");
    wrap.innerHTML = "";

    const colors = availableColors();

    let currentRoll = [];

    for(let i=0;i<4;i++){

        const color = colors[Math.floor(Math.random()*colors.length)];

        currentRoll.push(color);

        wrap.appendChild(createDice(color));
    }

    history.unshift(currentRoll);

    if(history.length > 20){
        history.pop();
    }

    updateHistory();
}

function updateHistory(){

    const historyList = document.getElementById("historyList");
    historyList.innerHTML = "";

    history.forEach((roll,index)=>{

        const row = document.createElement("div");
        row.className = "roll-row";

        const number = document.createElement("div");
        number.className = "roll-number";
        number.textContent = (index+1)+".";

        row.appendChild(number);

        roll.forEach(color=>{
            row.appendChild(createDice(color,true));
        });

        historyList.appendChild(row);

    });

}

/* HIDDEN SECRET MENU */
/* HOLD TOP TITLE FOR 3 SECONDS */

let holdTimer;

document.querySelector(".logo").addEventListener("touchstart", () => {

    holdTimer = setTimeout(openSecretMenu, 3000);

});

document.querySelector(".logo").addEventListener("touchend", () => {

    clearTimeout(holdTimer);

});

document.querySelector(".logo").addEventListener("mousedown", () => {

    holdTimer = setTimeout(openSecretMenu, 3000);

});

document.querySelector(".logo").addEventListener("mouseup", () => {

    clearTimeout(holdTimer);

});

function openSecretMenu(){

    let current = disabledColors.join(", ");

    let answer = prompt(
`Hidden Color Settings

Type colors to DISABLE separated by commas.

Example:
red, blue

Current disabled:
${current || "none"}`
    );

    if(answer === null) return;

    disabledColors = answer
        .split(",")
        .map(x=>x.trim().toLowerCase())
        .filter(x=>allColors.includes(x));

}

/* FIRST ROLL */
rollDice();
</script>

</body>
</html>
